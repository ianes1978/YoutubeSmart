name: Deploy to GitHub Pages

on:
  push:
    branches: [ccr-87d3b434-d1ohas]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancel stuck Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          STUCK: 42ed295e35caed404590a3558c8afa7669a184df
        run: |
          # Annulla il deploy rimasto "in corso" che blocca i nuovi e attende che risulti chiuso
          api="repos/${{ github.repository }}/pages/deployments/$STUCK"
          gh api "$api" || true
          gh api -X POST "$api/cancel" && echo "Cancel requested for $STUCK" || echo "Cancel request failed"
          for i in $(seq 1 24); do
            status=$(gh api "$api" --jq .status 2>/dev/null || echo unknown)
            echo "Status of $STUCK: $status"
            case "$status" in
              deployment_in_progress|syncing_files|finished_file_sync|updating_pages|deployment_queued|unknown) sleep 5 ;;
              *) break ;;
            esac
          done

      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
